name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Relative links resolve
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys, urllib.parse

          files = subprocess.run(
              ["git", "ls-files", "*.md"], capture_output=True, text=True, check=True
          ).stdout.split()

          broken = []
          for f in files:
              text = open(f, encoding="utf-8", errors="replace").read()
              for m in re.finditer(r"\[[^\]]*\]\(([^)\s]+)\)", text):
                  target = m.group(1)
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  path = urllib.parse.unquote(target.split("#")[0])
                  if not path:
                      continue
                  full = os.path.normpath(os.path.join(os.path.dirname(f), path))
                  if not os.path.exists(full):
                      broken.append(f"{f} -> {target}")

          if broken:
              print("Broken relative links:")
              for b in broken:
                  print("  " + b)
              sys.exit(1)
          print(f"OK - checked {len(files)} markdown files")
          PY

      - name: No credentials committed
        run: |
          # Push protection catches AWS keys; this also catches the event's own
          # credentials, which look like ordinary strings to GitHub.
          if git grep -n -E \
               'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|AWS_BEARER_TOKEN_BEDROCK=[A-Za-z0-9+/=]{20,}|TIDB_PASSWORD=[^<[:space:]]' \
               -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A credential looks committed. Remove it and rotate the key."
            exit 1
          fi
          echo "OK - no credential patterns found"
